name: Build APK

# Only build the newest commit pushed to a branch; stale APK builds are superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/liquid-glass-2.8.1
      - astra/performance-pass-1
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (leave empty to build the branch this workflow is run from)"
        required: false
        type: string
        default: "main"
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: "main"
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      ASTRA_KEYSTORE_BASE64:
        required: false
      ASTRA_STORE_PASSWORD:
        required: false
      ASTRA_KEY_PASSWORD:
        required: false
      ASTRA_KEY_ALIAS:
        required: false

jobs:
  test:
    name: Run launcher unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Run launcher unit tests
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:testDebugUnitTest

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: arm
            abi: armeabi-v7a
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID || secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
      ASTRA_STORE_PASSWORD: ${{ secrets.ASTRA_STORE_PASSWORD }}
      ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
      ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Validate Astra signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ASTRA_KEYSTORE_BASE64 ASTRA_STORE_PASSWORD ASTRA_KEY_PASSWORD ASTRA_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ASTRA_KEYSTORE_BASE64" | base64 --decode > ZalithLauncher/astra_release.jks
          test -s ZalithLauncher/astra_release.jks
          keytool -list -keystore ZalithLauncher/astra_release.jks \
            -storepass "$ASTRA_STORE_PASSWORD" -alias "$ASTRA_KEY_ALIAS" >/dev/null
          echo "Astra keystore and alias are valid."



      - name: Validate Microsoft OAuth configuration
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID="$(printf '%s' "${OAUTH_CLIENT_ID:-}" | tr -d '[:space:]')"
          if [[ -z "$CLIENT_ID" ]]; then
            echo "::error::Missing GitHub Actions secret OAUTH_CLIENT_ID. Configure a Microsoft Entra public-client app with device-code flow and personal Microsoft account support, then add its Application (client) ID as OAUTH_CLIENT_ID."
            exit 1
          fi
          if [[ ! "$CLIENT_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo "::error::OAUTH_CLIENT_ID must be a Microsoft Entra Application (client) ID in GUID format."
            exit 1
          fi
          echo "Microsoft OAuth configuration is present."

      - name: Build APK for ${{ matrix.abi }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=${{ matrix.arch }}

      - name: Rename APK (AstraLauncher-<upstream>-<patch>-<abi>.apk)
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          APK_DIR="ZalithLauncher/build/outputs/apk/release"
          RAW_VERSION="$(grep -E '^launcher_version_name=' ZalithLauncher/gradle.properties | head -n1 | cut -d= -f2- | tr -d '\r')"
          if [[ ! "$RAW_VERSION" =~ ^([0-9][0-9A-Za-z._]*)[[:space:]]+Astra[[:space:]]+(.+)$ ]]; then
            echo "launcher_version_name must look like '<upstream> Astra <patch>', got: '$RAW_VERSION'"
            exit 1
          fi
          UPSTREAM="${BASH_REMATCH[1]}"
          PATCH="$(echo "${BASH_REMATCH[2]}" | sed -E 's/[[:space:]]+/-/g; s/[^A-Za-z0-9._-]//g')"
          ARTIFACT_NAME="AstraLauncher-${UPSTREAM}-${PATCH}-${ABI}"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "Expected exactly one APK in $APK_DIR, found ${#APKS[@]}."
            exit 1
          fi
          APK_NAME="${ARTIFACT_NAME}.apk"
          mv "${APKS[0]}" "$APK_DIR/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Upload Release APK for ${{ matrix.abi }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ZalithLauncher/build/outputs/apk/release/${{ env.APK_NAME }}

      - name: Upload Release Mapping for ${{ matrix.abi }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
